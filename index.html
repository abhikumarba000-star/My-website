<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #4f46e5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: rgba(255,255,255,0.12);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #7c3aed;
            padding: 15px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn:hover {
            background: #9333ea;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome ❤️</h1>

        <p>
            Meri personal website mein aapka swagat hai.
            Yahan aap mere baare mein jaan sakte hain.
        </p>

        <a class="btn" href="details.html">
            Meri Details Dekho →
        </a>
    </div>

</body>
</html>
